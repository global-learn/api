name: GitHub CI
run-name: "${{github.actor}} is running CI"

on: [push]

jobs:
  Meeting-GitHub-Actions:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "🌏 Hello World!"
      - run: echo "☄️ The name of the branch is ${{github.ref}}"
      - name: "Check out repository code"
        uses: actions/checkout@v6
      - run: echo "😍 The ${{github.repository}} has been cloned to the runner"
      - run: echo "🤢 The workflow is now ready for test your code on the runner"
      - name: "List files in the repository"
        run: |
          ls ${{github.workspace}}
      - run: echo "💯 This job's status is ${{job.status}}"